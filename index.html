<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRONFORGE — Forge Your Limits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-primary: #0A0A0A;
      --bg-secondary: #111111;
      --bg-card: #1A1A1A;
      --accent: #FF3C00;
      --accent-warm: #FF6B35;
      --accent-gradient: linear-gradient(135deg, #FF3C00, #FF6B35);
      --text-primary: #FFFFFF;
      --text-secondary: #A0A0A0;
      --text-muted: #555555;
      --border: #222222;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    button { font-family: 'Inter', sans-serif; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* NAVBAR */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 20px 0; transition: all 0.3s ease;
    }
    .navbar.scrolled {
      background: rgba(10,10,10,0.95); backdrop-filter: blur(12px);
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .navbar .container { display:flex; align-items:center; justify-content:space-between; }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif; font-size: 32px;
      color: var(--accent); cursor: pointer; letter-spacing: 2px;
    }
    .nav-links { display:flex; gap:28px; align-items:center; list-style:none; }
    .nav-links a {
      font-size:14px; font-weight:500; color: var(--text-secondary);
      transition: color 0.3s ease; cursor:pointer;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-cta {
      background: var(--accent-gradient); color: white;
      padding: 10px 24px; border-radius: 4px; font-weight: 600;
      font-size: 14px; cursor: pointer; border: none;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(255,60,0,0.4); }
    .hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; z-index:1001; background:none; border:none; }
    .hamburger span { width:28px; height:2px; background:white; transition: all 0.3s ease; display:block; }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
    .hamburger.open span:nth-child(2) { opacity:0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }
    .mobile-menu {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background: var(--bg-primary); z-index:999;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
      opacity:0; pointer-events:none; transition: opacity 0.4s ease;
    }
    .mobile-menu.open { opacity:1; pointer-events:all; }
    .mobile-menu a {
      font-family:'Bebas Neue',sans-serif; font-size:48px;
      color: var(--text-secondary); transition: color 0.3s, transform 0.3s, opacity 0.3s;
      transform:translateY(20px); opacity:0;
    }
    .mobile-menu.open a { transform:translateY(0); opacity:1; }
    .mobile-menu a:hover { color: var(--accent); }

    /* HERO */
    .hero { min-height:100vh; display:flex; align-items:center; position:relative; overflow:hidden; }
    .hero-bg {
      position:absolute; inset:0;
      background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1600') center/cover;
    }
    .hero-overlay { position:absolute; inset:0; background: rgba(0,0,0,0.65); }
    .hero-content { position:relative; z-index:1; }
    .hero-eyebrow { font-size:13px; letter-spacing:4px; color: var(--accent); margin-bottom:16px; font-weight:600; }
    .hero-title {
      font-family:'Bebas Neue',sans-serif;
      font-size: clamp(64px,10vw,140px); line-height:0.9; margin-bottom:24px;
    }
    .hero-sub { font-size:17px; color: var(--text-secondary); max-width:480px; margin-bottom:40px; line-height:1.7; }
    .hero-buttons { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:80px; }
    .btn-primary {
      background: var(--accent-gradient); color:white; padding:16px 32px;
      border-radius:4px; font-weight:600; font-size:15px; cursor:pointer; border:none;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(255,60,0,0.4); }
    .btn-ghost {
      background:transparent; color:white; padding:16px 32px; border-radius:4px;
      font-weight:600; font-size:15px; cursor:pointer;
      border:1px solid rgba(255,255,255,0.3); transition: all 0.3s;
    }
    .btn-ghost:hover { border-color:white; background:rgba(255,255,255,0.1); }
    .hero-stats {
      display:grid; grid-template-columns:repeat(4,1fr); gap:32px;
      background:rgba(10,10,10,0.8); backdrop-filter:blur(10px);
      padding:32px 40px; border-radius:8px; border:1px solid var(--border);
    }
    .hero-stat-number { font-family:'Bebas Neue',sans-serif; font-size:36px; color: var(--accent); }
    .hero-stat-label { font-size:13px; color: var(--text-muted); margin-top:4px; }

    /* Hero Animations */
    .hero-animate { opacity:0; transform:translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .hero-animate.visible { opacity:1; transform:translateY(0); }

    /* SECTION */
    .section { padding:100px 0; }
    .section-label { font-size:13px; letter-spacing:4px; color: var(--accent); margin-bottom:12px; font-weight:600; }
    .section-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(36px,5vw,64px); line-height:1.1; margin-bottom:20px; }
    .section-subtitle { color: var(--text-secondary); max-width:500px; }

    /* SCROLL REVEAL */
    .reveal { opacity:0; transform:translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity:1; transform:translateY(0); }

    /* ABOUT BENTO */
    .about-bento { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
    .about-images { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .about-img { border-radius:8px; overflow:hidden; border:1px solid var(--border); }
    .about-img img { width:100%; height:200px; object-fit:cover; }
    .about-img:first-child { grid-column:span 2; }
    .about-img:first-child img { height:260px; }
    .about-divider { width:40px; height:3px; background:var(--accent-gradient); margin:24px 0; }
    .about-features { display:flex; flex-direction:column; gap:16px; margin-top:24px; }
    .about-feature { display:flex; align-items:center; gap:12px; font-size:15px; color: var(--text-secondary); }
    .about-feature .check { color: var(--accent); font-size:18px; }

    /* PROGRAMS */
    .programs-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:48px; }
    .program-card {
      position:relative; height:360px; border-radius:12px; overflow:hidden;
      border:1px solid var(--border); cursor:pointer;
      transition: border-color 0.3s;
    }
    .program-card:hover { border-color: var(--accent); }
    .program-card-bg {
      position:absolute; inset:0; background-size:cover; background-position:center;
      transition: transform 0.5s ease;
    }
    .program-card:hover .program-card-bg { transform:scale(1.05); }
    .program-card-overlay {
      position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%);
      transition: background 0.3s;
    }
    .program-card:hover .program-card-overlay {
      background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.3) 100%);
    }
    .program-card-tag {
      position:absolute; top:20px; left:20px;
      font-size:11px; letter-spacing:3px; color: var(--accent); font-weight:700;
      text-transform:uppercase;
    }
    .program-card-content { position:absolute; bottom:20px; left:20px; right:20px; }
    .program-card-name {
      font-family:'Bebas Neue',sans-serif; font-size:32px; line-height:1;
    }
    .program-card-desc { font-size:13px; color: var(--text-secondary); margin-top:8px; }
    .program-card-link {
      display:inline-flex; align-items:center; gap:6px;
      color: var(--accent); font-size:14px; font-weight:600;
      margin-top:12px; opacity:0; transform:translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .program-card:hover .program-card-link { opacity:1; transform:translateY(0); }

    /* TRAINERS */
    .trainers-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; margin-top:48px; }
    .trainer-card { text-align:center; }
    .trainer-img-wrap {
      position:relative; border-radius:12px; overflow:hidden;
      border:1px solid var(--border); aspect-ratio:1;
    }
    .trainer-img-wrap img {
      width:100%; height:100%; object-fit:cover;
      filter:grayscale(1); transition: filter 0.5s ease;
    }
    .trainer-card:hover .trainer-img-wrap img { filter:grayscale(0); }
    .trainer-img-wrap::after {
      content:''; position:absolute; bottom:0; left:0; right:0; height:3px;
      background:var(--accent-gradient); transform:scaleX(0);
      transition: transform 0.3s ease;
    }
    .trainer-card:hover .trainer-img-wrap::after { transform:scaleX(1); }
    .trainer-name {
      font-family:'Bebas Neue',sans-serif; font-size:26px; margin-top:16px;
    }
    .trainer-specialty { font-size:14px; color: var(--accent); }
    .trainer-socials { display:flex; justify-content:center; gap:16px; margin-top:12px; }
    .trainer-socials svg { width:18px; height:18px; fill: var(--text-muted); transition: fill 0.3s; cursor:pointer; }
    .trainer-socials svg:hover { fill: var(--accent); }

    /* BMI */
    .bmi-section { background: var(--bg-secondary); }
    .bmi-grid { display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
    .bmi-form { display:flex; flex-direction:column; gap:20px; }
    .bmi-toggle {
      display:flex; background: var(--bg-card); border-radius:8px;
      overflow:hidden; border:1px solid var(--border);
    }
    .bmi-toggle button {
      flex:1; padding:12px; border:none; background:transparent;
      color: var(--text-secondary); font-size:14px; font-weight:500;
      cursor:pointer; transition: all 0.3s;
    }
    .bmi-toggle button.active { background: var(--accent); color:white; }
    .bmi-input-group { display:flex; flex-direction:column; gap:6px; }
    .bmi-input-group label { font-size:13px; color: var(--text-secondary); font-weight:500; }
    .bmi-input {
      padding:14px 16px; background: var(--bg-card); border:1px solid var(--border);
      border-radius:4px; color:white; font-size:15px; outline:none;
      transition: border-color 0.3s;
    }
    .bmi-input:focus { border-color: var(--accent); }
    .bmi-gender { display:flex; gap:12px; }
    .bmi-gender label {
      flex:1; padding:12px; text-align:center; border-radius:4px;
      border:1px solid var(--border); cursor:pointer; font-size:14px;
      transition: all 0.3s; color: var(--text-secondary);
    }
    .bmi-gender input { display:none; }
    .bmi-gender input:checked + span { color: var(--accent); }
    .bmi-gender label:has(input:checked) { border-color: var(--accent); background: rgba(255,60,0,0.1); color: var(--accent); }
    .bmi-calc-btn {
      padding:16px; background:var(--accent-gradient); border:none;
      border-radius:4px; color:white; font-size:16px; font-weight:700;
      cursor:pointer; transition: transform 0.3s, box-shadow 0.3s;
    }
    .bmi-calc-btn:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(255,60,0,0.4); }
    .bmi-image { position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); }
    .bmi-image img { width:100%; height:400px; object-fit:cover; }
    .bmi-image::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg, rgba(255,60,0,0.2), transparent);
    }

    /* BMI Result */
    .bmi-result {
      background: var(--bg-card); border-radius:12px; padding:32px;
      border:1px solid var(--border); margin-top:8px;
    }
    .bmi-number {
      font-family:'Bebas Neue',sans-serif; font-size:72px; line-height:1;
    }
    .bmi-category { font-size:18px; font-weight:600; margin-top:4px; }
    .bmi-gauge { height:8px; background: var(--border); border-radius:4px; margin-top:20px; overflow:hidden; }
    .bmi-gauge-fill {
      height:100%; border-radius:4px;
      transition: width 0.8s ease, background-color 0.5s ease;
    }
    .bmi-recommendation { font-size:14px; color: var(--text-secondary); margin-top:16px; line-height:1.6; }
    .bmi-book-btn {
      margin-top:20px; padding:12px 24px; background:var(--accent-gradient);
      border:none; border-radius:4px; color:white; font-weight:600;
      cursor:pointer; font-size:14px; transition: transform 0.3s;
    }
    .bmi-book-btn:hover { transform:translateY(-2px); }

    /* FEATURES */
    .features-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:48px; margin-top:48px;
    }
    .feature-item { text-align:center; }
    .feature-icon { font-size:40px; margin-bottom:16px; }
    .feature-title {
      font-family:'Bebas Neue',sans-serif; font-size:24px; margin-bottom:8px;
    }
    .feature-desc { font-size:14px; color: var(--text-secondary); line-height:1.6; }

    /* GALLERY MASONRY */
    .gallery-grid {
      columns:3; column-gap:16px; margin-top:48px;
    }
    .gallery-item {
      break-inside:avoid; margin-bottom:16px; border-radius:8px;
      overflow:hidden; position:relative; cursor:pointer;
    }
    .gallery-item img {
      width:100%; display:block; filter:grayscale(0.4);
      transition: filter 0.4s, transform 0.4s;
    }
    .gallery-item:hover img { filter:grayscale(0); transform:scale(1.03); }
    .gallery-caption {
      position:absolute; bottom:0; left:0; right:0;
      padding:16px; background:linear-gradient(transparent, rgba(0,0,0,0.8));
      opacity:0; transition: opacity 0.3s;
      font-size:13px; color: var(--text-secondary); font-style:italic;
    }
    .gallery-item:hover .gallery-caption { opacity:1; }

    /* PRICING */
    .pricing-section { background: var(--bg-secondary); }
    .pricing-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:48px; }
    .pricing-card {
      background: rgba(26,26,26,0.6); backdrop-filter:blur(10px);
      border-radius:16px; padding:40px 32px; text-align:center;
      border:1px solid var(--border); transition: transform 0.3s, box-shadow 0.3s;
      position:relative;
    }
    .pricing-card:hover { transform:translateY(-4px); }
    .pricing-card.popular {
      border-color: var(--accent);
      box-shadow:0 0 30px rgba(255,60,0,0.15);
      transform:scale(1.05);
    }
    .pricing-card.popular:hover { transform:scale(1.05) translateY(-4px); }
    .pricing-badge {
      position:absolute; top:-12px; left:50%; transform:translateX(-50%);
      background:var(--accent-gradient); color:white; padding:4px 16px;
      border-radius:20px; font-size:12px; font-weight:700; letter-spacing:1px;
    }
    .pricing-plan { font-family:'Bebas Neue',sans-serif; font-size:28px; margin-bottom:8px; }
    .pricing-price {
      font-family:'Bebas Neue',sans-serif; font-size:56px; color: var(--accent);
    }
    .pricing-cycle { font-size:14px; color: var(--text-muted); margin-bottom:24px; }
    .pricing-features { list-style:none; text-align:left; margin-bottom:32px; }
    .pricing-features li {
      padding:10px 0; border-bottom:1px solid var(--border);
      font-size:14px; color: var(--text-secondary);
      display:flex; align-items:center; gap:10px;
    }
    .pricing-features .included { color: var(--accent); }
    .pricing-features .excluded { color: var(--text-muted); }
    .pricing-btn {
      width:100%; padding:14px; border:none; border-radius:4px;
      font-size:15px; font-weight:600; cursor:pointer; transition: transform 0.3s;
    }
    .pricing-btn.primary { background:var(--accent-gradient); color:white; }
    .pricing-btn.ghost { background:transparent; border:1px solid var(--border); color:white; }
    .pricing-btn:hover { transform:translateY(-2px); }

    /* TESTIMONIALS */
    .testimonials-wrap { position:relative; overflow:hidden; margin-top:48px; }
    .testimonials-track {
      display:flex; transition: transform 0.5s ease;
    }
    .testimonial-card {
      min-width:100%; padding:0 48px;
    }
    .testimonial-inner {
      background: var(--bg-card); border-radius:16px; padding:40px;
      border:1px solid var(--border); text-align:center; max-width:600px; margin:0 auto;
    }
    .testimonial-avatar {
      width:72px; height:72px; border-radius:50%; object-fit:cover;
      border:3px solid var(--accent); margin:0 auto 16px;
    }
    .testimonial-stars { color:var(--accent); font-size:18px; margin-bottom:16px; letter-spacing:4px; }
    .testimonial-quote {
      font-size:17px; color: var(--text-secondary); font-style:italic;
      line-height:1.7; margin-bottom:20px; min-height:80px;
    }
    .testimonial-name { font-family:'Bebas Neue',sans-serif; font-size:22px; }
    .testimonial-tag { font-size:13px; color: var(--accent); font-weight:600; }
    .testimonial-nav { display:flex; justify-content:center; gap:12px; margin-top:32px; align-items:center; }
    .testimonial-arrow {
      width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
      background:transparent; color:white; font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition: all 0.3s;
    }
    .testimonial-arrow:hover { border-color: var(--accent); color: var(--accent); }
    .testimonial-dots { display:flex; gap:8px; }
    .testimonial-dot {
      width:10px; height:10px; border-radius:50%; background: var(--border);
      border:none; cursor:pointer; transition: background 0.3s;
    }
    .testimonial-dot.active { background: var(--accent); }

    /* CONTACT */
    .contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-top:48px; }
    .contact-form { display:flex; flex-direction:column; gap:16px; }
    .contact-input, .contact-textarea, .contact-select {
      padding:14px 16px; background: var(--bg-card); border:1px solid var(--border);
      border-radius:4px; color:white; font-size:15px; outline:none;
      font-family:'Inter',sans-serif; transition: border-color 0.3s;
    }
    .contact-input:focus, .contact-textarea:focus, .contact-select:focus { border-color: var(--accent); }
    .contact-textarea { resize:vertical; min-height:120px; }
    .contact-select { appearance:none; cursor:pointer; }
    .contact-select option { background: var(--bg-card); }
    .contact-submit {
      padding:16px; background:var(--accent-gradient); border:none;
      border-radius:4px; color:white; font-size:16px; font-weight:700;
      cursor:pointer; transition: transform 0.3s;
    }
    .contact-submit:hover { transform:translateY(-2px); }
    .contact-info h3 {
      font-family:'Bebas Neue',sans-serif; font-size:36px; margin-bottom:24px;
    }
    .contact-detail { display:flex; gap:12px; margin-bottom:16px; align-items:flex-start; }
    .contact-detail-icon { font-size:18px; margin-top:2px; }
    .contact-detail-text { font-size:14px; color: var(--text-secondary); line-height:1.6; }
    .contact-hours { margin-top:24px; }
    .contact-hours h4 { font-family:'Bebas Neue',sans-serif; font-size:20px; margin-bottom:12px; color: var(--accent); }
    .contact-hours p { font-size:14px; color: var(--text-secondary); margin-bottom:6px; }
    .contact-map {
      margin-top:24px; height:160px; background: var(--bg-card); border-radius:8px;
      border:1px solid var(--border); display:flex; align-items:center;
      justify-content:center; font-size:16px; color: var(--text-muted);
    }

    /* FOOTER */
    .footer {
      background: #050505; border-top:3px solid transparent;
      border-image: var(--accent-gradient) 1; padding:60px 0 0;
    }
    .footer-grid {
      display:grid; grid-template-columns:2fr 1fr 1fr 1.5fr; gap:40px;
      padding-bottom:40px; border-bottom:1px solid var(--border);
    }
    .footer-logo { font-family:'Bebas Neue',sans-serif; font-size:36px; color: var(--accent); }
    .footer-tagline { font-size:14px; color: var(--text-secondary); margin-top:8px; max-width:260px; }
    .footer-socials { display:flex; gap:16px; margin-top:16px; }
    .footer-socials svg { width:20px; height:20px; fill: var(--text-muted); transition: fill 0.3s; cursor:pointer; }
    .footer-socials svg:hover { fill: var(--accent); }
    .footer-col h4 {
      font-family:'Bebas Neue',sans-serif; font-size:18px; margin-bottom:16px;
      letter-spacing:1px;
    }
    .footer-col a {
      display:block; font-size:14px; color: var(--text-secondary);
      margin-bottom:10px; transition: color 0.3s;
    }

    // ========== BMI CALCULATOR ==========
    function BMICalculator() {
      const [unit, setUnit] = useState('metric');
      const [height, setHeight] = useState('');
      const [weight, setWeight] = useState('');
      const [age, setAge] = useState('');
      const [gender, setGender] = useState('male');
      const [result, setResult] = useState(null);

      const calculateBMI = () => {
        let h = parseFloat(height);
        let w = parseFloat(weight);
        if (!h || !w || h <= 0 || w <= 0) return;

        let bmi;
        if (unit === 'metric') {
          bmi = w / ((h / 100) * (h / 100));
        } else {
          bmi = (w / (h * h)) * 703;
        }

        let category, color, recommendation;
        if (bmi < 18.5) {
          category = 'Underweight';
          color = '#3B82F6';
          recommendation = 'Consider a nutrition plan to gain healthy weight. Our trainers can help you build a lean mass program.';
        } else if (bmi < 25) {
          category = 'Normal Weight';
          color = '#22C55E';
          recommendation = 'You are at a healthy weight. Maintain your fitness with balanced training and nutrition.';
        } else if (bmi < 30) {
          category = 'Overweight';
          color = '#F97316';
          recommendation = 'A structured cardio and strength program can help you shed excess weight effectively.';
        } else {
          category = 'Obese';
          color = '#EF4444';
          recommendation = 'We recommend starting with guided training and a personalized nutrition plan. Book a consultation today.';
        }

        setResult({ bmi: bmi.toFixed(1), category, color, recommendation, gaugeWidth: Math.min((bmi / 40) * 100, 100) });
      };

      return (
        <section className="section bmi-section" id="bmi-section">
          <div className="container">
            <div className="bmi-grid">
              <div className="reveal">
                <div className="section-label">FREE TOOL</div>
                <h2 className="section-title">Know Your Body. Plan Your Training.</h2>
                <div className="bmi-form">
                  <div className="bmi-toggle">
                    <button className={unit === 'metric' ? 'active' : ''} onClick={() => setUnit('metric')}>Metric (kg/cm)</button>
                    <button className={unit === 'imperial' ? 'active' : ''} onClick={() => setUnit('imperial')}>Imperial (lbs/in)</button>
                  </div>
                  <div className="bmi-input-group">
                    <label>Height {unit === 'metric' ? '(cm)' : '(in)'}</label>
                    <input className="bmi-input" type="number" placeholder={unit === 'metric' ? '175' : '68'} value={height} onChange={e => setHeight(e.target.value)} />
                  </div>
                  <div className="bmi-input-group">
                    <label>Weight {unit === 'metric' ? '(kg)' : '(lbs)'}</label>
                    <input className="bmi-input" type="number" placeholder={unit === 'metric' ? '75' : '165'} value={weight} onChange={e => setWeight(e.target.value)} />
                  </div>
                  <div className="bmi-input-group">
                    <label>Age (optional)</label>
                    <input className="bmi-input" type="number" placeholder="25" value={age} onChange={e => setAge(e.target.value)} />
                  </div>
                  <div className="bmi-input-group">
                    <label>Gender</label>
                    <div className="bmi-gender">
                      <label><input type="radio" name="gender" value="male" checked={gender === 'male'} onChange={() => setGender('male')} /><span>Male</span></label>
                      <label><input type="radio" name="gender" value="female" checked={gender === 'female'} onChange={() => setGender('female')} /><span>Female</span></label>
                    </div>
                  </div>
                  <button className="bmi-calc-btn" onClick={calculateBMI}>Calculate BMI</button>
                </div>
                {result && (
                  <div className="bmi-result">
                    <div className="bmi-number" style={{ color: result.color }}>{result.bmi}</div>
                    <div className="bmi-category" style={{ color: result.color }}>{result.category}</div>
                    <div className="bmi-gauge">
                      <div className="bmi-gauge-fill" style={{ width: `${result.gaugeWidth}%`, background: result.color }} />
                    </div>
                    <div className="bmi-recommendation">{result.recommendation}</div>
                    <button className="bmi-book-btn">Book a Trainer</button>
                  </div>
                )}
              </div>
              <div className="bmi-image reveal">
                <img src="https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=800" alt="Athlete training" />
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ========== APP ==========
    function App() {
      const [activePage, setActivePage] = useState('home');

      // Intersection Observer for scroll reveal
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
              }
            });
          },
          { threshold: 0.1 }
        );
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, [activePage]);

      // Re-observe on page change
      useEffect(() => {
        const timer = setTimeout(() => {
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
              });
            },
            { threshold: 0.1 }
          );
          document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
          return () => observer.disconnect();
        }, 100);
        return () => clearTimeout(timer);
      }, [activePage]);

      return (
        <>
          <Navbar activePage={activePage} setActivePage={setActivePage} />
          {activePage === 'home' && (
            <>
              <Hero setActivePage={setActivePage} />
              <About />
              <Programs setActivePage={setActivePage} />
              <Trainers />
              <Features />
              <Gallery />
              <Pricing setActivePage={setActivePage} />
              <Testimonials />
              <Contact />
            </>
          )}
          {activePage === 'programs' && <Programs setActivePage={setActivePage} />}
          {activePage === 'trainers' && <Trainers />}
          {activePage === 'bmi' && <BMICalculator />}
          {activePage === 'gallery' && <Gallery />}
          {activePage === 'contact' && <Contact />}
          <Footer setActivePage={setActivePage} />
        </>
      );
